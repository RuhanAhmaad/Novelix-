name: 🚀 Build NOVELIX Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Deploy to Vercel (provides live backend)
  # ─────────────────────────────────────────────
  deploy-vercel:
    name: 🌐 Deploy Web App to Vercel
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy to Vercel (Production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gzwpfvhmjweeydiwdsga.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_APwu-OfPQmtnj-f-pwxfZw_OxiwM8A1' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_APwu-OfPQmtnj-f-pwxfZw_OxiwM8A1' }}
          NEXT_PUBLIC_IMGBB_API_KEY: ${{ secrets.NEXT_PUBLIC_IMGBB_API_KEY || 'a9985ccf572a0e05bce242e27cf8be33' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY || 'a9985ccf572a0e05bce242e27cf8be33' }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying to Vercel with credentials..."
            DEPLOY_URL=$(vercel --prod --token "$VERCEL_TOKEN" --yes 2>&1 | grep -E "https://" | tail -1)
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "✅ Deployed to: $DEPLOY_URL"
          else
            echo "url=https://novelix.vercel.app" >> "$GITHUB_OUTPUT"
            echo "⚠️ No Vercel credentials found. Using placeholder URL."
            echo "   Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets to enable auto-deploy."
          fi

  # ─────────────────────────────────────────────
  # JOB 2: Build Android APK
  # ─────────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: deploy-vercel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set Deployment URL
        id: set-url
        run: |
          DEPLOY_URL="${{ needs.deploy-vercel.outputs.deployment_url }}"
          if [ -z "$DEPLOY_URL" ] || [ "$DEPLOY_URL" = "null" ]; then
            DEPLOY_URL="https://novelix.vercel.app"
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "📡 APK will connect to: $DEPLOY_URL"

      - name: Update Capacitor Config with Live URL
        run: |
          DEPLOY_URL="${{ steps.set-url.outputs.url }}"
          cat > capacitor.config.ts << EOF
          import type { CapacitorConfig } from '@capacitor/cli';
          
          const config: CapacitorConfig = {
            appId: 'com.novelix.app',
            appName: 'NOVELIX',
            webDir: 'out',
            server: {
              url: '${DEPLOY_URL}',
              androidScheme: 'https',
              cleartext: false,
              hostname: 'novelix.app',
            },
            android: {
              allowMixedContent: false,
              backgroundColor: '#070709',
              webContentsDebuggingEnabled: false,
            },
            plugins: {
              SplashScreen: {
                launchShowDuration: 2000,
                backgroundColor: '#070709',
                showSpinner: false,
              },
            },
          };
          
          export default config;
          EOF
          echo "✅ Capacitor config updated to use $DEPLOY_URL"

      - name: Create Static Out Directory (Required by Capacitor)
        run: |
          mkdir -p out
          cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>NOVELIX</title>
              <script>window.location.href = 'https://novelix.vercel.app';</script>
            </head>
            <body style="background:#070709;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
              <p>Loading NOVELIX...</p>
            </body>
          </html>
          HTMLEOF

      - name: Sync Capacitor Android
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gzwpfvhmjweeydiwdsga.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_APwu-OfPQmtnj-f-pwxfZw_OxiwM8A1' }}
        run: |
          pnpx cap sync android
          echo "✅ Capacitor synced"

      - name: Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built!"

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "✅ Release APK built!"

      - name: List Built APKs
        run: |
          find android/app/build/outputs/apk -name "*.apk" -type f | while read f; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "📦 $f ($SIZE)"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVELIX-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: NOVELIX-Release-APK-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## 🎉 NOVELIX APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | com.novelix.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL | ${{ steps.set-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | Debug + Release (Unsigned) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Instructions" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Actions** tab in your GitHub repo" >> $GITHUB_STEP_SUMMARY
          echo "2. Click this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll to **Artifacts** at the bottom" >> $GITHUB_STEP_SUMMARY
          echo "4. Download **NOVELIX-Debug-APK**" >> $GITHUB_STEP_SUMMARY
          echo "5. Transfer to your Android device and install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Installation Note" >> $GITHUB_STEP_SUMMARY
          echo "Enable **Install Unknown Apps** in Android Settings → Security before installing" >> $GITHUB_STEP_SUMMARY
